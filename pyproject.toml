[project]
name = "tachygraf"
version = "0.1.0"
description = "Recorded lecture to a verbatim transcript and linked study notes, fully local"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mateusz Okulanis", email = "109816464+FPGArtktic@users.noreply.github.com" }]
dependencies = [
    "faster-whisper>=1.1",
    "gradio>=4.44",
    "numpy>=2.0",           # the ASR stage hands the model samples, not a path
    "nvidia-ml-py>=12.0",   # is the card free before the ASR stage asks for it
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

# The CUDA runtime CTranslate2 dlopens for the ASR stage. ctranslate2 does not
# declare these itself, so without them the GPU path fails at the first
# inference with "Library libcublas.so.12 is not found" -- after the weights
# are already on the card (see docs/DECISIONS.md). They are an extra rather
# than a dependency because they are 1.5 GB that only the container needs; the
# host test suite never touches the card.
#
# ctranslate2 4.8 is built against cuBLAS 12 and cuDNN 9. Both majors are
# pinned: a cuDNN 10 wheel would install cleanly and fail at run time.
cuda = [
    "nvidia-cublas-cu12>=12.3,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]

[project.scripts]
tachygraf = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ffmpeg: needs the ffmpeg binary; skipped when it is absent",
]
